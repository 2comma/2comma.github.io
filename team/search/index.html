<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Search · Team Status</title>
<meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; style-src &#x27;unsafe-inline&#x27;; script-src &#x27;sha256-XIf6rNuufpDvGD2w4DMqVNW+nQmqGeqo6J4NCoYW9ZE=&#x27;; connect-src &#x27;self&#x27;; img-src &#x27;self&#x27; data:; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;; frame-ancestors &#x27;none&#x27;">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f6f4;
  --ink: #1c1917;
  --muted: #44403c;
  --line: #d6d3d1;
  --paper: #ffffff;
  --danger: #9f1239;
  --warning: #92400e;
  --success: #166534;
  --info: #1e3a8a;
  --callout-bg: #fffbeb;
  --callout-ink: #1c1917;
  --focus: #1d4ed8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413;
    --ink: #f5f5f4;
    --muted: #d6d3d1;
    --line: #44403c;
    --paper: #1c1c1a;
    --danger: #fecdd3;
    --warning: #fde68a;
    --success: #bbf7d0;
    --info: #bfdbfe;
    --callout-bg: #292524;
    --callout-ink: #f5f5f4;
    --focus: #93c5fd;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip {
  position: absolute;
  left: 0.75rem;
  top: 0.75rem;
  padding: 0.4rem 0.7rem;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  transform: translateY(-200%);
}
.skip:focus { transform: none; }
main { margin: 0 auto; padding: 2rem 1.25rem 3rem; }
main[data-width="column"] { max-width: 43.75rem; }
main[data-width="wide"] { max-width: 80rem; }
main[data-width="full"] { max-width: none; }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 0.75rem; }
h2 { font-size: 1.3rem; line-height: 1.3; margin: 0 0 0.75rem; }
h3 { font-size: 1.05rem; line-height: 1.35; margin: 0; }
.summary { margin: 0 0 1.25rem; font-size: 1.05rem; }
.tools { margin: 0 0 1rem; }
.srch { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1rem; }
.srch input { flex: 1 1 14rem; min-width: 0; min-height: 2.75rem; padding: 0 0.75rem; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); }
.srch button { min-height: 2.75rem; padding: 0 1rem; font: inherit; font-weight: 600; color: var(--ink); background: var(--paper); border: 1px solid var(--line); cursor: pointer; }
.hit { padding: 0.9rem 0; border-top: 1px solid var(--line); }
.hit h2 { font-size: 1.05rem; margin: 0; }
.hit p { margin: 0.3rem 0 0; }
nav ol { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0; margin: 0 0 2rem; list-style: none; }
nav a { color: var(--ink); }
.section { margin: 0 0 2.5rem; }
.caption { margin: 0.75rem 0 0; color: var(--muted); }
.rows { display: flex; flex-direction: column; }
.row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  column-gap: 0.75rem;
  row-gap: 0.35rem;
  align-items: baseline;
  padding: 0.9rem 0;
  border-top: 1px solid var(--line);
}
.row.no-lead { grid-template-columns: minmax(0, 1fr) auto auto; }
.lead { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.title { margin: 0; }
.detail { grid-column: 2 / -1; margin: 0; }
.row.no-lead .detail { grid-column: 1 / -1; }
.meta { margin: 0; color: var(--muted); text-align: right; }
.status { margin: 0; font-weight: 600; white-space: nowrap; }
.status[data-tone="danger"] { color: var(--danger); }
.status[data-tone="warning"] { color: var(--warning); }
.status[data-tone="success"] { color: var(--success); }
.callout {
  margin: 0 0 1rem;
  padding: 0.9rem 1rem;
  background: var(--callout-bg);
  color: var(--callout-ink);
  border-left: 4px solid var(--line);
}
.callout[data-tone="warning"] { border-left-color: var(--warning); }
.callout[data-tone="danger"] { border-left-color: var(--danger); }
.callout[data-tone="success"] { border-left-color: var(--success); }
.callout[data-tone="info"] { border-left-color: var(--info); }
.callout p { margin: 0.4rem 0 0; }
.callout p:first-child { margin-top: 0; }
.kicker { font-weight: 700; }
.prose { margin: 0.9rem 0 0; }
.scroll-hint { margin: 0 0 0.4rem; color: var(--muted); font-size: 0.9rem; }
.table-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  background: var(--paper);
}
table { border-collapse: collapse; width: 100%; min-width: 52rem; }
th, td {
  border-bottom: 1px solid var(--line);
  padding: 0.55rem 0.7rem;
  text-align: left;
  vertical-align: top;
}
th { font-weight: 600; }
tbody th { font-weight: 600; }
tr:last-child th, tr:last-child td { border-bottom: 0; }
td[data-tone="danger"], th[data-tone="danger"] { color: var(--danger); font-weight: 600; }
td[data-tone="warning"], th[data-tone="warning"] { color: var(--warning); font-weight: 600; }
td[data-tone="success"], th[data-tone="success"] { color: var(--success); font-weight: 600; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 640px) {
  .row, .row.no-lead { grid-template-columns: auto minmax(0, 1fr); }
  .status, .meta, .row.no-lead .status, .row.no-lead .meta { grid-column: 2; text-align: left; }
  .detail, .row.no-lead .detail { grid-column: 2; }
  .row.no-lead .title { grid-column: 1 / -1; }
  .status { white-space: normal; }
}
@media (min-width: 801px) {
  .scroll-hint { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
}
@media print {
  body { background: #fff; color: #000; }
  .skip, nav { display: none; }
  .table-scroll { overflow: visible; }
  table { min-width: 0; }
  a { text-decoration: none; }
}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<main id="content" data-width="column">
<header>
<h1>Search Team Status</h1>
<p class="tools"><a href="../">Back to Team Status</a></p>
</header>
<form class="srch" id="sf" role="search"><label class="sr-only" for="sq">Search</label><input id="sq" name="q" type="search" autocomplete="off" placeholder="Search names, tasks, status…"><button type="submit">Search</button></form>
<p class="caption" id="sst" aria-live="polite">Search needs JavaScript.</p>
<div id="sr"></div>
</main>
<script>(function(){var f=document.getElementById('sf'),q=document.getElementById('sq'),out=document.getElementById('sr'),st=document.getElementById('sst'),D=null;function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function draw(){if(!D)return;var t=norm(q.value).split(/\s+/).filter(Boolean);if(!t.length){st.textContent=D.count+' entries. Type to search.';out.innerHTML='';return}var r=D.items.filter(function(it){var h=it._h||(it._h=norm(it.t+' '+it.x+' '+it.st+' '+it.s));for(var i=0;i<t.length;i++)if(h.indexOf(t[i])<0)return false;return true});if(!r.length){st.textContent='';out.innerHTML='<p class="summary">No results for \u201c'+esc(q.value)+'\u201d.</p>';return}st.textContent=r.length+(r.length===1?' result':' results');out.innerHTML=r.map(function(it){return '<article class="hit"><h2><a href="../#'+esc(it.a)+'">'+esc(it.t)+'</a></h2>'+'<p class="caption">'+esc(it.s)+(it.st?' \u00b7 '+esc(it.st):'')+'</p>'+(it.x?'<p>'+esc(it.x)+'</p>':'')+'</article>'}).join('')}q.value=new URLSearchParams(location.search).get('q')||'';f.addEventListener('submit',function(e){e.preventDefault();draw()});q.addEventListener('input',draw);st.textContent='Loading\u2026';fetch('../search.json').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;draw()}).catch(function(){st.textContent='Search index could not be loaded.'})})()</script>
</body>
</html>
