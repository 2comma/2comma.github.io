<script src="/news/assets/ep.js"></script><script>(function(){var f=document.getElementById('sf'),q=document.getElementById('sq'),sel=document.getElementById('ss'),out=document.getElementById('sr'),stt=document.getElementById('sst'),S=JSON.parse(document.getElementById('sui').textContent);
var src=f.getAttribute('data-src'),base=src.replace(/search\.json$/,''),D=null,lim=50;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fm(k,o){return S[k].replace(/\{(\w+)\}/g,function(m,n){return n in o?o[n]:m})}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function draw(){if(!D)return;var t=norm(q.value).split(/\s+/).filter(Boolean),s=sel.value;
var r=D.items.filter(function(it){if(s&&it.s!==s)return false;var h=it._h||(it._h=norm(it.t+' '+it.x+' '+it.c+' '+(D.secs[it.s]||'')+' '+it.d));for(var i=0;i<t.length;i++)if(h.indexOf(t[i])<0)return false;return true});
try{var url=new URL(location.href);if(q.value)url.searchParams.set('q',q.value);else url.searchParams.delete('q');history.replaceState(null,'',url)}catch(e){}
if(!t.length&&!s){stt.textContent=fm('search.summary',{n:D.count,oldest:D.oldest,newest:D.newest});out.innerHTML='';return}
if(!r.length){stt.textContent='';out.innerHTML='<p class="empty-sec">'+esc(fm('search.none',{q:q.value}))+'</p>';return}
stt.textContent=r.length===1?S['search.one']:fm('search.results',{n:r.length});
out.innerHTML='<div class="ngrid">'+r.slice(0,lim).map(function(it){return '<article class="ncard sec-'+esc(it.s)+'"><div class="meta"><span class="dchip">'+esc(it.d)+'</span><b class="cat">'+esc(D.secs[it.s]||it.s)+(it.c?' · '+esc(it.c):'')+'</b></div><h3><a class="hl" href="'+esc(base+it.u)+'">'+esc(it.t)+'</a></h3>'+(it.x?'<p>'+esc(it.x)+'</p>':'')+'</article>'}).join('')+'</div>'+(r.length>lim?'<p class="mt"><button type="button" class="pg" id="smore">'+esc(S['search.more'])+'</button></p>':'');
var b=document.getElementById('smore');if(b)b.onclick=function(){lim+=50;draw()}}
var p=new URLSearchParams(location.search);q.value=p.get('q')||'';if(p.get('s'))sel.value=p.get('s');
f.addEventListener('submit',function(e){e.preventDefault();lim=50;draw()});q.addEventListener('input',function(){lim=50;draw()});sel.addEventListener('change',function(){lim=50;draw()});
stt.textContent=S['search.loading'];fetch(src).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){D=j;draw()}).catch(function(){stt.textContent=S['search.error']})})()</script></body></html>
